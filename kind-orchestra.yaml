# kind cluster: 1 control-plane + 2 workers
# Workers carry a "tenant" label so later demos can pin workloads per tenant.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orchestra
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:      # expose ingress on localhost:8080 / 8443
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
- role: worker
  labels:
    tenant: tenant-a
- role: worker
  labels:
    tenant: tenant-b

