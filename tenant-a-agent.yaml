apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service-a
  namespace: tenant-a-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-a
  template:
    metadata:
      labels:
        app: agent-a
    spec:
      nodeSelector:
        tenant: tenant-a
      tolerations:
      - key: "tenant"
        operator: "Equal"
        value: "tenant-a"
        effect: "NoSchedule"
      containers:
      - name: mock-agent
        image: nginx:alpine
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
