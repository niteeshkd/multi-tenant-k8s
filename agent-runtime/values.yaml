tenant:
  id: tenant-a

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector:
  tenant: tenant-a

tolerations:
  - key: "tenant"
    operator: "Equal"
    value: "tenant-a"
    effect: "NoSchedule"
